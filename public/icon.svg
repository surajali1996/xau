<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#131722"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#1E222D" stroke="#2B2F3A" stroke-width="4"/>
  <!-- Grid Lines -->
  <line x1="60" y1="160" x2="452" y2="160" stroke="#2B2F3A" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="60" y1="256" x2="452" y2="256" stroke="#2B2F3A" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="60" y1="352" x2="452" y2="352" stroke="#2B2F3A" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Bullish Candle 1 -->
  <line x1="120" y1="180" x2="120" y2="380" stroke="#089981" stroke-width="8" stroke-linecap="round"/>
  <rect x="96" y="220" width="48" height="120" rx="8" fill="#089981"/>
  <!-- Bearish Candle 2 -->
  <line x1="210" y1="150" x2="210" y2="340" stroke="#F23645" stroke-width="8" stroke-linecap="round"/>
  <rect x="186" y="190" width="48" height="100" rx="8" fill="#F23645"/>
