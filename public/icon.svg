  <line x1="300" y1="110" x2="300" y2="360" stroke="#089981" stroke-width="8" stroke-linecap="round"/>
  <rect x="276" y="140" width="48" height="170" rx="8" fill="#089981"/>
  <!-- Trend Line -->
  <path d="M 80 370 L 210 280 L 300 180 L 430 110" fill="none" stroke="#2962FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Marker point -->
  <circle cx="430" cy="110" r="16" fill="#2962FF" stroke="#FFFFFF" stroke-width="4"/>
  <!-- Badge text -->
  <rect x="360" y="400" width="92" height="34" rx="8" fill="#2962FF"/>
  <text x="406" y="423" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">PRO</text>
