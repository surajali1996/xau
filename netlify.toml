[build]
  command = "npm run build"
  publish = "dist"

# Single-page app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always revalidate the service worker and manifest so app updates roll out immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
